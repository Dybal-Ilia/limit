[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "limit"
version = "0.1.0"
description = "Learning Information Retrieval Models with Intelligent Testing - hybrid IR research framework"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.0.1",
    "matplotlib>=3.10.7",
    "numpy>=2.3.4",
    "pandas>=2.3.3",
    "pyyaml>=6.0.3",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=5.1.2",
    "torch>=2.9.0",
    "torchvision>=0.24.0",
    "transformers>=4.57.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]
